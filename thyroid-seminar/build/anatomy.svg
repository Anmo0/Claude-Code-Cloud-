  <path d="M685 350 C 650 352, 610 350, 586 350" stroke="#3E6FB0" stroke-width="5" fill="none"/>
  <path d="M440 400 C 438 470, 436 560, 432 664" stroke="#3E6FB0" stroke-width="5" fill="none"/>
  <path d="M462 400 C 464 470, 466 560, 470 664" stroke="#3E6FB0" stroke-width="5" fill="none"/>
  
  <text x="330" y="600" font-size="22" font-weight="700" fill="#0C2A45" text-anchor="middle">Right</text>
  <text x="570" y="600" font-size="22" font-weight="700" fill="#0C2A45" text-anchor="middle">Left</text>
  <text x="450" y="22" font-size="17" fill="#5A6678" text-anchor="middle">Anterior view</text>
