<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" font-family="Calibri, Carlito, Arial, sans-serif">
  <rect width="1440" height="690" fill="#FFFFFF"/>
  <g transform="translate(270,0)">
