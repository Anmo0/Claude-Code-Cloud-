  <text x="12" y="98" font-size="30" font-weight="700" fill="#0C2A45" text-anchor="start">Superior thyroid a.</text><text x="12" y="128" font-size="24" fill="#5A6678" text-anchor="start">external carotid</text>
  <line x1="277" y1="282" x2="560" y2="350" stroke="#5A6678" stroke-width="2"/>
  <circle cx="560" cy="350" r="5" fill="#0C2A45"/>
  <text x="12" y="278" font-size="30" font-weight="700" fill="#0C2A45" text-anchor="start">Middle thyroid v.</text><text x="12" y="308" font-size="24" fill="#5A6678" text-anchor="start">to IJV</text>
  <line x1="307" y1="462" x2="460" y2="520" stroke="#5A6678" stroke-width="2"/>
  <circle cx="460" cy="520" r="5" fill="#0C2A45"/>
  <text x="12" y="458" font-size="30" font-weight="700" fill="#0C2A45" text-anchor="start">Inferior thyroid a.</text><text x="12" y="488" font-size="24" fill="#5A6678" text-anchor="start">thyrocervical trunk</text>
  <line x1="202" y1="632" x2="610" y2="430" stroke="#5A6678" stroke-width="2"/>
  <circle cx="610" cy="430" r="5" fill="#0C2A45"/>
  <text x="12" y="628" font-size="30" font-weight="700" fill="#0C2A45" text-anchor="start">Thyroid lobe</text><text x="12" y="658" font-size="24" fill="#5A6678" text-anchor="start">right side</text>
  <line x1="1202" y1="102" x2="740" y2="368" stroke="#5A6678" stroke-width="2"/>
  <circle cx="740" cy="368" r="5" fill="#0C2A45"/>
  <text x="1428" y="98" font-size="30" font-weight="700" fill="#0C2A45" text-anchor="end">Isthmus</text><text x="1428" y="128" font-size="24" fill="#5A6678" text-anchor="end">tracheal rings 2–4</text>
  <line x1="1214" y1="282" x2="820" y2="452" stroke="#5A6678" stroke-width="2"/>
  <circle cx="820" cy="452" r="5" fill="#0C2A45"/>
  <text x="1428" y="278" font-size="30" font-weight="700" fill="#0C2A45" text-anchor="end">Parathyroids</text><text x="1428" y="308" font-size="24" fill="#5A6678" text-anchor="end">posterior surface</text>
  <line x1="1088" y1="462" x2="769" y2="560" stroke="#5A6678" stroke-width="2"/>
  <circle cx="769" cy="560" r="5" fill="#0C2A45"/>
  <text x="1428" y="458" font-size="30" font-weight="700" fill="#9A6F00" text-anchor="end">Recurrent laryngeal n.</text><text x="1428" y="488" font-size="24" fill="#5A6678" text-anchor="end">tracheo-oesophageal groove</text>
  <line x1="1118" y1="632" x2="738" y2="620" stroke="#5A6678" stroke-width="2"/>
  <circle cx="738" cy="620" r="5" fill="#0C2A45"/>
  <text x="1428" y="628" font-size="30" font-weight="700" fill="#0C2A45" text-anchor="end">Inferior thyroid vv.</text><text x="1428" y="658" font-size="24" fill="#5A6678" text-anchor="end">to brachiocephalic v.</text>
  </g>
</svg>